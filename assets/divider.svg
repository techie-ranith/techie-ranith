<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 10" fill="none" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.12" stop-color="#FF5A1F"/>
      <stop offset="0.32" stop-color="#FFD24A"/>
      <stop offset="0.52" stop-color="#2EE6C0"/>
      <stop offset="0.78" stop-color="#2B8CFF"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-400%" width="140%" height="900%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="900" height="10" fill="#000000"/>
  <rect x="8" y="4" width="884" height="2" rx="1" fill="url(#neon)" filter="url(#glow)"/>
</svg>
